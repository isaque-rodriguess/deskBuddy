name: ci

on:
  pull_request:
    branches: [feat/tauri-rewrite, main]
  push:
    branches: [feat/tauri-rewrite]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: install linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend deps
        run: npm ci

      - name: frontend typecheck
        run: npm run check

      - name: rust fmt
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: rust clippy
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: rust test
        run: cargo test --manifest-path src-tauri/Cargo.toml --all

      - name: rust build
        run: cargo build --manifest-path src-tauri/Cargo.toml
